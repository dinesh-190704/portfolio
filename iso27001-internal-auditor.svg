<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 842 596" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="842" height="596" fill="url(#bgGrad)"/>

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="794" height="548" fill="none" stroke="#0f172a" stroke-width="3" rx="4"/>
  <rect x="32" y="32" width="778" height="532" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" rx="2"/>
  <rect x="38" y="38" width="766" height="520" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Corner Ornaments -->
  <path d="M 46 64 L 64 46 M 46 46 L 74 46 M 46 46 L 46 74" fill="none" stroke="#b45309" stroke-width="2"/>
  <path d="M 796 64 L 778 46 M 796 46 L 768 46 M 796 46 L 796 74" fill="none" stroke="#b45309" stroke-width="2"/>
  <path d="M 46 532 L 64 550 M 46 550 L 74 550 M 46 550 L 46 522" fill="none" stroke="#b45309" stroke-width="2"/>
  <path d="M 796 532 L 778 550 M 796 550 L 768 550 M 796 550 L 796 522" fill="none" stroke="#b45309" stroke-width="2"/>

  <!-- Header: Issuer -->
  <text x="421" y="85" font-family="'Georgia', serif" font-size="28" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="2">BEACON DESYNE</text>
  <text x="421" y="105" font-family="'Courier New', monospace" font-size="12" fill="#64748b" text-anchor="middle" letter-spacing="1">WWW.BEACONDESYNE.IN • MANAGEMENT SYSTEMS &amp; CERTIFICATION</text>
  <line x1="280" y1="118" x2="562" y2="118" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Certificate Heading -->
  <text x="421" y="165" font-family="'Georgia', serif" font-size="22" font-style="italic" fill="#b45309" text-anchor="middle" letter-spacing="1">Certificate of Completion</text>
  <text x="421" y="200" font-family="'Arial', sans-serif" font-size="14" fill="#475569" text-anchor="middle">This is to certify that</text>

  <!-- Candidate Name -->
  <text x="421" y="250" font-family="'Georgia', serif" font-size="34" font-weight="bold" fill="#0f172a" text-anchor="middle" letter-spacing="1">DINESH</text>
  <line x1="260" y1="262" x2="582" y2="262" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Body Text -->
  <text x="421" y="295" font-family="'Arial', sans-serif" font-size="14.5" fill="#334155" text-anchor="middle">
    has attended and successfully completed the training and assessment for the qualification of
  </text>
  <text x="421" y="332" font-family="'Arial', sans-serif" font-size="21" font-weight="bold" fill="#0284c7" text-anchor="middle" letter-spacing="0.5">
    INTERNAL AUDITOR FOR ISO 27001:2022 STANDARD
  </text>

  <!-- Training Content Box -->
  <rect x="140" y="360" width="562" height="68" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="421" y="385" font-family="'Courier New', monospace" font-size="11.5" font-weight="bold" fill="#475569" text-anchor="middle" letter-spacing="0.5">TRAINING &amp; EVALUATION CONTENT:</text>
  <text x="421" y="410" font-family="'Arial', sans-serif" font-size="12.5" fill="#1e293b" text-anchor="middle">
    Performing Internal Audit • Auditing Techniques • Practical Audit Situation &amp; Evaluation Method
  </text>

  <!-- Footer Metadata & Signatures -->
  <!-- Left: Cert Details -->
  <text x="80" y="480" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#0f172a">CERTIFICATE NO:</text>
  <text x="210" y="480" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#0284c7">BD/TC/2025/ISMS-250</text>
  
  <text x="80" y="505" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#0f172a">HELD ON:</text>
  <text x="160" y="505" font-family="'Courier New', monospace" font-size="12" fill="#475569">Oct 16th &amp; 17th, 2025</text>

  <text x="80" y="530" font-family="'Courier New', monospace" font-size="11" fill="#64748b">STANDARD: ISO/IEC 27001:2022 ISMS</text>

  <!-- Center Seal Badge -->
  <g transform="translate(421, 495)">
    <circle r="36" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <circle r="31" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="2,2"/>
    <text y="-8" font-family="'Arial', sans-serif" font-size="9" font-weight="bold" fill="#b45309" text-anchor="middle">ISO 27001:2022</text>
    <text y="5" font-family="'Georgia', serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">AUDITOR</text>
    <text y="18" font-family="'Arial', sans-serif" font-size="8" fill="#78350f" text-anchor="middle">CERTIFIED</text>
  </g>

  <!-- Right: Authorized Signatory -->
  <g transform="translate(680, 485)">
    <!-- Signature Graphic -->
    <path d="M -60 5 Q -30 -15 -10 2 Q 15 -10 40 5 Q 50 12 25 15 Q -5 18 -40 10" fill="none" stroke="#1e3a8a" stroke-width="1.8"/>
    <line x1="-80" y1="20" x2="60" y2="20" stroke="#94a3b8" stroke-width="1"/>
    <text x="-10" y="36" font-family="'Arial', sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">Head Training</text>
    <text x="-10" y="50" font-family="'Arial', sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Beacon Desyne</text>
  </g>
</svg>
